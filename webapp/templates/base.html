<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Houston Lab's secure, GPU-accelerated chemical library preparation service.">
    <meta name="theme-color" content="#0a0e17">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/houstonlab-logo.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}" data-app-root="{{ app_root }}">
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </body>
</html>
